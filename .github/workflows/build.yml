name: Test and package PayPamin Flow Python app

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to attach the Python package to (optional)
        required: false
        type: string
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  desktop:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install Tkinter on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk
      - name: Install application dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        shell: bash
        run: |
          set +e
          python -m unittest discover -s tests -v > test-results.txt 2>&1
          status=$?
          cat test-results.txt
          if [ "$status" -ne 0 ]; then
            STATUS="$status" python - <<'PY'
          import os
          from pathlib import Path
          output = Path("test-results.txt").read_text(encoding="utf-8", errors="replace")[-12000:]
          output = output.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error::Tests failed with exit code {os.environ['STATUS']}%0A{output}")
          PY
          fi
          exit "$status"
      - name: Verify desktop imports
        run: python -c "import tkinter; import fitz; import reportlab; import PIL; import tray; import paypamin_flow"
      - name: Package Python application and SHA-256
        if: runner.os == 'Linux'
        run: python packaging/package_release.py --output release-assets
      - name: Upload Python release package
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: PayPamin-Flow-Python-release
          path: release-assets/
          if-no-files-found: error

  publish-python-package:
    name: Publish Python package
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Python package
        uses: actions/download-artifact@v4
        with:
          name: PayPamin-Flow-Python-release
          path: release-assets
      - name: Attach Python package to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
        run: gh release upload "$RELEASE_TAG" release-assets/* --clobber --repo "$REPOSITORY"
