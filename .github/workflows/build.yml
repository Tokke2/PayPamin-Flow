name: Test and package PayPamin Flow Python app

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to attach the Python package to (optional)
        required: false
        type: string
  push:
    # Arena session branches run the full Windows/macOS/Linux matrix on every
    # push, so verification never depends on opening a pull request.
    branches: [main, 'arena/**']
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  desktop:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install Tkinter on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb xauth
      - name: Install application dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        shell: bash
        run: |
          set +e
          if [ "${RUNNER_OS:-}" = "Linux" ]; then
            xvfb-run -a -s "-screen 0 1280x900x24" python -m unittest discover -s tests -v > test-results.txt 2>&1
          else
            python -m unittest discover -s tests -v > test-results.txt 2>&1
          fi
          status=$?
          cat test-results.txt
          if [ "$status" -ne 0 ]; then
            STATUS="$status" python - <<'PY'
          import os
          from pathlib import Path
          output = Path("test-results.txt").read_text(encoding="utf-8", errors="replace")[-3000:]
          output = output.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error::Tests failed with exit code {os.environ['STATUS']}%0A{output}")
          PY
          fi
          exit "$status"
      - name: Verify branding can be rebuilt from the vector masters
        run: python assets/verify_branding.py
      - name: Verify desktop imports
        run: python -c "import tkinter; import fitz; import reportlab; import PIL; import cv2; import tray; import paypamin_flow"
  refresh-release-files:
    name: Point the release at the branch's code
    # The release *is* the source code at its tag: GitHub generates the archive
    # itself, so there is nothing to upload and the two can never disagree.
    # Every push to a working branch moves the tag to that commit, which makes
    # the release carry the newest code; the app updates from that archive.
    # main is deliberately not a source: the work is never merged, so a
    # release built from main would carry code no branch contains. Nothing here
    # merges or opens a pull request.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/arena/')
    needs: desktop
    runs-on: ubuntu-latest
    concurrency:
      group: release-refresh
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Move the tag and describe the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          version=$(python -c "import app_info; print(app_info.APP_VERSION)")
          tag="v$version"
          if ! gh api "repos/$REPOSITORY/releases/tags/$tag" --jq .id > /dev/null 2>&1; then
            echo "No release $tag exists yet; nothing to refresh"
            exit 0
          fi
          # The tag follows the branch, so the archive GitHub generates for it -
          # the one the app downloads - is this commit.
          gh api -X PATCH "repos/$REPOSITORY/git/refs/tags/$tag" \
            -f sha="$COMMIT" -F force=true > /dev/null
          release_id=$(gh api "repos/$REPOSITORY/releases/tags/$tag" --jq .id)
          python packaging/release_description.py \
            --tag "$tag" --repository "$REPOSITORY" --commit "$COMMIT" \
            --output release-body.md
          gh api -X PATCH "repos/$REPOSITORY/releases/$release_id" \
            -F body=@release-body.md > /dev/null
          echo "Release $tag now points at $COMMIT and its source archive is that code"
