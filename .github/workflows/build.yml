name: Test and package PayPamin Flow Python app

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to attach the Python package to (optional)
        required: false
        type: string
  push:
    # Arena session branches run the full Windows/macOS/Linux matrix on every
    # push, so verification never depends on opening a pull request. Never
    # target main: work happens exclusively on the active session branch.
    branches: ['arena/**']
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  desktop:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install Tkinter on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb xauth
      - name: Install application dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        shell: bash
        run: |
          set +e
          if [ "${RUNNER_OS:-}" = "Linux" ]; then
            xvfb-run -a -s "-screen 0 1280x900x24" python -m unittest discover -s tests -v > test-results.txt 2>&1
          else
            python -m unittest discover -s tests -v > test-results.txt 2>&1
          fi
          status=$?
          cat test-results.txt
          if [ "$status" -ne 0 ]; then
            STATUS="$status" python - <<'PY'
          import os
          from pathlib import Path
          output = Path("test-results.txt").read_text(encoding="utf-8", errors="replace")[-3000:]
          output = output.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error::Tests failed with exit code {os.environ['STATUS']}%0A{output}")
          PY
          fi
          exit "$status"
      - name: Verify branding can be rebuilt from the vector masters
        run: python assets/verify_branding.py
      - name: Verify desktop imports
        run: python -c "import tkinter; import fitz; import reportlab; import PIL; import cv2; import tray; import paypamin_flow"
  refresh-release-files:
    name: Point the release at the branch's code
    # The release *is* the source code at its tag: GitHub generates the archive
    # itself, so there is nothing to upload and the two can never disagree.
    # Every push to a working branch moves the tag to that commit, which makes
    # the release carry the newest code; the app updates from that archive.
    # main is deliberately not a source: the work is never merged, so a
    # release built from main would carry code no branch contains. Nothing here
    # merges or opens a pull request.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/arena/')
    needs: desktop
    runs-on: ubuntu-latest
    concurrency:
      group: release-refresh
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Move the tag and describe the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          version=$(python -c "import app_info; print(app_info.APP_VERSION)")
          tag="v$version"
          python packaging/release_description.py \
            --tag "$tag" --repository "$REPOSITORY" --commit "$COMMIT" \
            --output release-body.md
          if ! gh api "repos/$REPOSITORY/releases/tags/$tag" --jq .id > /dev/null 2>&1; then
            if gh api "repos/$REPOSITORY/git/ref/tags/$tag" > /dev/null 2>&1; then
              gh api -X PATCH "repos/$REPOSITORY/git/refs/tags/$tag" \
                -f sha="$COMMIT" -F force=true > /dev/null
            else
              gh api -X POST "repos/$REPOSITORY/git/refs" \
                -f ref="refs/tags/$tag" -f sha="$COMMIT" > /dev/null
            fi
            release_id=$(gh api -X POST "repos/$REPOSITORY/releases" \
              -f tag_name="$tag" \
              -f name="PayPamin Flow $version" \
              -f target_commitish="$COMMIT" \
              -F body=@release-body.md \
              -F draft=false \
              -F prerelease=false \
              -f make_latest=true --jq .id)
          else
            # The tag follows the branch, so the archive GitHub generates for it -
            # the one newer installs download - is this commit.
            gh api -X PATCH "repos/$REPOSITORY/git/refs/tags/$tag" \
              -f sha="$COMMIT" -F force=true > /dev/null
            release_id=$(gh api "repos/$REPOSITORY/releases/tags/$tag" --jq .id)
            gh api -X PATCH "repos/$REPOSITORY/releases/$release_id" \
              -f target_commitish="$COMMIT" \
              -F body=@release-body.md \
              -F draft=false \
              -F prerelease=false \
              -f make_latest=true > /dev/null
          fi
          # Build and attach PayPamin-Flow-Python.zip + .sha256 so existing 0.6.0
          # installations (e.g. b2f6ac48f496) can self-update directly in-app
          # without manual download.
          python packaging/package_release.py \
            --source . \
            --output release-assets \
            --release-id "$release_id" \
            --release-commit "$COMMIT"
          git checkout -- build_info.py
          for attempt in 1 2 3; do
            if gh release upload "$tag" \
              release-assets/PayPamin-Flow-Python.zip \
              release-assets/PayPamin-Flow-Python.zip.sha256 \
              --clobber --repo "$REPOSITORY"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep 3
          done
          rm -rf release-assets release-body.md
          echo "Release $tag now points at $COMMIT, marked as Latest, with Python update package attached"
      - name: Verify the release really carries this commit
        # The step above reports what it asked GitHub to do. This one reads the
        # result back - tag, page, file list and the archive itself - so a
        # rejected tag move or a stale body fails the run instead of leaving a
        # release that describes code nobody pushed.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          version=$(python -c "import app_info; print(app_info.APP_VERSION)")
          tag="v$version"
          if ! gh api "repos/$REPOSITORY/releases/tags/$tag" --jq .id > /dev/null 2>&1; then
            echo "No release $tag exists yet; nothing to verify"
            exit 0
          fi
          python packaging/verify_release.py \
            --tag "$tag" --repository "$REPOSITORY" --commit "$COMMIT" --version "$version" \
            --checkout .
